<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" fill="none" role="img" aria-labelledby="title desc">
<!-- SVG created with Arrow, by QuiverAI (https://quiver.ai) -->
  <title id="title">See the idea clearly</title>
  <desc id="desc">A question in an open notebook follows a curling ink thread into a visual explanation. Two softly colored, overlapping shapes connect what you know with what you discover, revealing a new insight.</desc>
  <defs>
    <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(29)">
      <path d="M2 0V7" stroke="#252923" stroke-width=".8" opacity=".3"/>
    </pattern>
    <clipPath id="leftShape">
      <path d="M497 204C478 173 438 166 407 186C376 206 375 248 395 275C415 303 455 309 484 289C512 270 515 231 497 204Z"/>
    </clipPath>
    <style>
      .ink{stroke:#252923;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
      .fine{stroke:#252923;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
      .label{font-family:Georgia,'Times New Roman',serif;fill:#252923}
      .thread{stroke-dasharray:420;stroke-dashoffset:420;animation:trace 7s ease-in-out infinite}
      .insight{transform-box:fill-box;transform-origin:center;animation:breathe 7s ease-in-out infinite}
      .rays{animation:glimmer 7s ease-in-out infinite}
      @keyframes trace{0%,8%{stroke-dashoffset:420;opacity:0}14%{opacity:1}48%,85%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}
      @keyframes breathe{0%,35%,100%{transform:scale(.94)}55%,78%{transform:scale(1.06)}}
      @keyframes glimmer{0%,38%,100%{opacity:.25}55%,78%{opacity:1}}
      @media(prefers-reduced-motion:reduce){.thread{animation:none;stroke-dashoffset:0}.insight,.rays{animation:none}}
    </style>
  </defs>
