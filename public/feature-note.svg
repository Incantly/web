<!-- SVG created with Arrow, by QuiverAI (https://quiver.ai) -->
  <title id="title">Notes that go further</title>
  <desc id="desc">A pencil captures a thought in a tabbed notebook. A connected research clipping and a gently growing leafy stem suggest ideas being organized and built upon.</desc>
  <defs>
    <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <path d="M1 0V7" stroke="#262922" stroke-width=".8" opacity=".32"/>
    </pattern>
    <style>
      .ink { stroke:#262922; stroke-width:2.7; stroke-linecap:round; stroke-linejoin:round; }
      .fine { stroke:#262922; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; }
      .grow { transform-origin:511px 211px; animation:sway 6s ease-in-out infinite; }
      .spark { transform-origin:574px 79px; animation:twinkle 4s ease-in-out infinite; }
      .thought { stroke-dasharray:220; stroke-dashoffset:220; animation:write 7s ease-in-out infinite; }
      .pencil { animation:hover 7s ease-in-out infinite; }
      @keyframes sway { 0%,100% { transform:rotate(-2deg); } 50% { transform:rotate(3deg); } }
      @keyframes twinkle { 0%,100% { opacity:.5; transform:scale(.86); } 50% { opacity:1; transform:scale(1.08); } }
      @keyframes write { 0%,10% { stroke-dashoffset:220; } 48%,88% { stroke-dashoffset:0; } 100% { stroke-dashoffset:220; } }
      @keyframes hover { 0%,100% { transform:translate(0,0); } 40%,65% { transform:translate(3px,-5px); } }
      @media (prefers-reduced-motion:reduce) {
        .grow,.spark,.thought,.pencil { animation:none; }
        .thought { stroke-dashoffset:0; }
      }
    </style>
  </defs>
