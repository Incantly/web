  <title>Visuals made from your ideas</title>
  <desc>A tangled ink thought unwinds into a colorful imagined world: a peach arch, a floating golden sun, and a blue sphere. Gentle drawing and floating animations bring the idea to life.</desc>
  <defs>
    <pattern id="hatching" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(24)">
      <path d="M2 0V8" stroke="#272620" stroke-width=".8" opacity=".27"/>
    </pattern>
