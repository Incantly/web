    </clipPath>
    <style>
      .ink{stroke:#272620;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
      .fine{stroke:#272620;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}
      .thread{stroke-dasharray:360;stroke-dashoffset:360;animation:unwind 7s ease-in-out infinite}
      .sun{animation:float 7s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
      .spark{animation:glimmer 7s ease-in-out infinite}
      .pencil{animation:sketch 7s ease-in-out infinite;transform-box:fill-box;transform-origin:20% 90%}
      @keyframes unwind{0%,8%{stroke-dashoffset:360;opacity:0}15%{opacity:1}48%,82%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}
      @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
      @keyframes glimmer{0%,25%,100%{opacity:.3}48%,72%{opacity:1}}
      @keyframes sketch{0%,100%{transform:rotate(0deg)}36%{transform:rotate(-4deg)}58%{transform:rotate(2deg)}}
      @media(prefers-reduced-motion:reduce){.thread,.sun,.spark,.pencil{animation:none}.thread{stroke-dashoffset:0}}
    </style>
  </defs>
