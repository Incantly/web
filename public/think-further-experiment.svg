<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" fill="none" role="img" aria-labelledby="title desc">
<!-- SVG created with Arrow, by QuiverAI (https://quiver.ai) -->
  <title id="title">Try it for yourself</title>
  <desc id="desc">A question becomes a playful physics experiment. A hand adjusts a slider beneath a miniature scene, while a coral ball follows a bouncing path toward a little cup.</desc>
  <defs>
    <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(32)">
      <path d="M1 0V7" stroke="#292B28" stroke-width=".8" opacity=".22"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M2 2L9 6L2 10" fill="none" stroke="#292B28" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .ink{stroke:#292B28;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
      .fine{stroke:#292B28;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
      .adjust{animation:adjust 5s ease-in-out infinite}
      .glint{animation:glint 5s ease-in-out infinite;transform-origin:543px 326px}
      @keyframes adjust{0%,12%,88%,100%{transform:translateX(0)}35%,65%{transform:translateX(58px)}}
      @keyframes glint{0%,62%,100%{opacity:0;transform:scale(.6)}72%,82%{opacity:1;transform:scale(1)}}
      @media(prefers-reduced-motion:reduce){.adjust,.glint{animation:none}.moving-ball{display:none}.still-ball{display:inline}}
    </style>
  </defs>
  <!-- A roomy, hand-inked miniature experiment -->
